name: Materialize CASEFLOW source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-caseflow.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/caseflow-source.tar.gz
          echo '2f17d752adf15de8c4ccd5fdbe1c2ac4fb39d33027f22d111f4a4fb33a3328fb  /tmp/caseflow-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/caseflow-source.tar.gz -C .

      - name: Commit materialized CASEFLOW source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'caseflow-bootstrap'
          git config user.email 'caseflow-bootstrap@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize CASEFLOW v0.5 foundation and browser v3 demo'
          git push origin HEAD:main
